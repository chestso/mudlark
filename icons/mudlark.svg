<svg width="512" height="512" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background drop shadow -->
    <filter id="icon-shadow" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" in="SourceAlpha" result="blur"/>
      <feOffset dx="0" dy="12" result="offset"/>
      <feFlood flood-color="#101018" flood-opacity="0.85" result="color"/>
      <feComposite in2="offset" in="color" operator="in" result="shadow1"/>
      <feMerge>
        <feMergeNode in="shadow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path to keep interior elements inside the rounded container -->
    <clipPath id="squircle-clip">
      <rect x="18" y="18" width="220" height="220" rx="52"/>
    </clipPath>

    <!-- Midnight Sky (Clear, deep Dracula night) -->
    <radialGradient id="midnight-sky" cx="62%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#343746"/>
      <stop offset="28%" stop-color="#282a36"/>
      <stop offset="65%" stop-color="#191a21"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>

    <!-- Full Moon Luminous Disk Gradient (Dracula Foreground/Cyan tones) -->
    <radialGradient id="full-moon-surface" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8f8f2"/>
      <stop offset="68%" stop-color="#e2e8f0"/>
      <stop offset="88%" stop-color="#8be9fd"/>
      <stop offset="100%" stop-color="#6272a4"/>
    </radialGradient>

    <!-- Lunar Halo / Moonlight Ambient Bloom -->
    <radialGradient id="moon-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#8be9fd" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#bd93f9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#282a36" stop-opacity="0"/>
    </radialGradient>

    <!-- Dracula Bezel Gradient -->
    <linearGradient id="dracula-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd93f9"/>
      <stop offset="35%" stop-color="#ff79c6"/>
      <stop offset="70%" stop-color="#8be9fd"/>
      <stop offset="100%" stop-color="#50fa7b"/>
    </linearGradient>

    <!-- Deep Midnight River Water -->
    <linearGradient id="midnight-river" x1="85%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%" stop-color="#12151f"/>
      <stop offset="40%" stop-color="#182030"/>
      <stop offset="80%" stop-color="#0f1522"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>

    <!-- Mudbank Shoreline Gradients (Rich organic silt) -->
    <linearGradient id="mudbank-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44475a"/>
      <stop offset="30%" stop-color="#2c2d3a"/>
      <stop offset="70%" stop-color="#1b1c24"/>
      <stop offset="100%" stop-color="#0d0e14"/>
    </linearGradient>

    <!-- Golden glow radiating out from deep inside the mudbank -->
    <radialGradient id="sub-mud-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fff8db"/>
      <stop offset="45%" stop-color="#f1fa8c"/>
      <stop offset="70%" stop-color="#ffb86c"/>
      <stop offset="88%" stop-color="#ff79c6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>

    <!-- Broad golden atmosphere bloom across water and shore -->
    <radialGradient id="treasure-bloom" cx="42%" cy="72%" r="65%">
      <stop offset="0%" stop-color="#f1fa8c" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#ffb86c" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#ff79c6" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#bd93f9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#191a21" stop-opacity="0"/>
    </radialGradient>

    <!-- River Water Surface Golden Sheen -->
    <linearGradient id="water-gold-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1fa8c" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#ffb86c" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#bd93f9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#191a21" stop-opacity="0"/>
    </linearGradient>

    <!-- Moonlight Reflection Sheen on River Surface -->
    <linearGradient id="moonlight-water-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#8be9fd" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6272a4" stop-opacity="0"/>
    </linearGradient>

    <!-- Moon Glow Filter -->
    <filter id="moon-filter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feGaussianBlur stdDeviation="10" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Diffuse Glow Filter for buried gold -->
    <filter id="soft-radiance" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feGaussianBlur stdDeviation="24" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="core-radiance" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="16" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== CONTAINER FRAME WITH DROP SHADOW ==================== -->
  <g filter="url(#icon-shadow)">
    <!-- Base Squircle -->
    <rect x="18" y="18" width="220" height="220" rx="52" fill="url(#midnight-sky)"/>
  </g>

  <!-- ==================== CLIPPED INTERIOR ARTWORK ==================== -->
  <g clip-path="url(#squircle-clip)">
    <!-- Midnight Sky -->
    <rect x="18" y="18" width="220" height="220" rx="52" fill="url(#midnight-sky)"/>

    <!-- Subtle Clear Night Stars in Dracula tones -->
    <g opacity="0.5">
      <circle cx="48" cy="44" r="0.8" fill="#f8f8f2"/>
      <circle cx="78" cy="36" r="1.0" fill="#8be9fd"/>
      <circle cx="112" cy="50" r="0.7" fill="#f8f8f2"/>
      <circle cx="136" cy="34" r="0.8" fill="#bd93f9"/>
      <circle cx="216" cy="48" r="0.9" fill="#f8f8f2"/>
      <circle cx="226" cy="72" r="0.7" fill="#8be9fd"/>
      <circle cx="38" cy="70" r="0.7" fill="#bd93f9"/>
      <circle cx="94" cy="62" r="0.8" fill="#f8f8f2"/>
      <circle cx="124" cy="76" r="0.6" fill="#8be9fd"/>
    </g>

    <!-- ==================== FULL MOON IN CLEAR NIGHT SKY ==================== -->
    <!-- Ambient Lunar Halo Blooming behind the Moon -->
    <circle cx="168" cy="62" r="38" fill="url(#moon-halo)"/>

    <!-- Luminous Full Moon Disk -->
    <g filter="url(#moon-filter)">
      <circle cx="168" cy="62" r="17" fill="url(#full-moon-surface)"/>
      <!-- Subtle lunar maria / surface texture in soft Dracula Comment tones -->
      <path d="M 164 54 C 168 53 173 56 172 60 C 171 63 166 64 163 61 Z" fill="#6272a4" opacity="0.32"/>
      <path d="M 158 64 C 161 62 165 65 164 68 C 163 71 157 70 156 67 Z" fill="#6272a4" opacity="0.28"/>
      <path d="M 169 66 C 173 65 178 68 177 71 C 175 74 168 73 167 69 Z" fill="#6272a4" opacity="0.25"/>
      <!-- Pure white specular crescent edge on moon -->
      <path d="M 155 58 C 158 50 170 48 178 52 C 169 50 158 54 155 58 Z" fill="#ffffff" opacity="0.7"/>
    </g>

    <!-- Distant Far Bank / Mountain Ridge Silhouette under Moonlight -->
    <path d="M 18 108 
             C 48 102 78 112 116 104 
             C 152 96 186 108 214 102 
             C 224 100 232 102 238 100 
             L 238 126 L 18 126 Z" 
          fill="#14161f" opacity="0.95"/>

    <!-- ==================== FLOWING MIDNIGHT RIVER ==================== -->
    <path d="M 18 116 
             C 62 108 120 120 172 112 
             C 204 108 226 112 238 110 
             L 238 238 L 18 238 Z" 
          fill="url(#midnight-river)"/>

    <!-- Moonlight Column Reflection Shimmering on the River Surface under the Moon -->
    <ellipse cx="168" cy="120" rx="14" ry="2.5" fill="url(#moonlight-water-sheen)"/>
    <ellipse cx="166" cy="127" rx="18" ry="3" fill="url(#moonlight-water-sheen)"/>
    <ellipse cx="168" cy="135" rx="22" ry="3.5" fill="url(#moonlight-water-sheen)" opacity="0.9"/>
    <ellipse cx="165" cy="144" rx="26" ry="4" fill="url(#moonlight-water-sheen)" opacity="0.75"/>

    <!-- River current ripples catching cold midnight starlight & moonlight -->
    <path d="M 148 122 C 174 118 204 124 230 119" stroke="#6272a4" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
    <path d="M 126 132 C 158 127 194 135 226 129" stroke="#6272a4" stroke-width="1.2" opacity="0.35" stroke-linecap="round"/>
    <path d="M 138 144 C 170 139 206 147 236 141" stroke="#8be9fd" stroke-width="1" opacity="0.25" stroke-linecap="round"/>

    <!-- ==================== BROAD GOLDEN BLOOM ESCAPING FROM DEEP IN THE BANK ==================== -->
    <!-- Warm golden atmosphere spilling from deep inside the bank over water & mud -->
    <ellipse cx="106" cy="180" rx="110" ry="60" fill="url(#treasure-bloom)"/>

    <!-- Water surface golden reflection ripples from the buried treasure -->
    <ellipse cx="146" cy="154" rx="46" ry="5.5" fill="url(#water-gold-sheen)"/>
    <ellipse cx="166" cy="164" rx="38" ry="5" fill="url(#water-gold-sheen)" opacity="0.85"/>
    <ellipse cx="180" cy="174" rx="30" ry="4.5" fill="url(#water-gold-sheen)" opacity="0.65"/>

    <!-- ==================== MUDDY RIVERBANK SHORELINE ==================== -->
    <!-- Shallow mud shelf under water -->
    <path d="M 18 148 
             C 52 142 94 156 130 152 
             C 166 148 198 164 224 170 
             C 232 172 236 174 238 174 
             L 238 238 L 18 238 Z" 
          fill="#1b1d28"/>

    <!-- Waterline curving gently along the bank, catching the golden glow -->
    <path d="M 18 150 C 54 144 96 158 132 154 C 168 150 200 166 228 172" fill="none" stroke="#f1fa8c" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    <path d="M 28 158 C 66 154 104 166 142 162 C 178 158 208 174 234 179" fill="none" stroke="#8be9fd" stroke-width="1" stroke-linecap="round" opacity="0.35"/>

    <!-- Heavy exposed mudbank slope rising from the river -->
    <path d="M 18 162 
             C 46 156 82 168 114 164 
             C 146 160 176 176 202 182 
             C 218 186 230 192 238 190 
             L 238 238 L 18 238 Z" 
          fill="url(#mudbank-deep)"/>

    <!-- ==================== THE GOLDEN GLOW FROM DEEP INSIDE THE MUD ==================== -->
    <!--
      The treasure is completely buried and invisible deep inside the bank.
      Only its warm, radiant golden light wells up through the mud layers,
      illuminating the bank and the night air.
    -->
    <g filter="url(#soft-radiance)">
      <!-- Soft diffuse golden light pool blooming out from within the mud -->
      <ellipse cx="104" cy="184" rx="55" ry="24" fill="url(#sub-mud-glow)"/>
    </g>

    <g filter="url(#core-radiance)">
      <!-- Warmer, brighter light welling up through the mudbed -->
      <ellipse cx="104" cy="184" rx="34" ry="14" fill="#f1fa8c" opacity="0.9"/>
      <ellipse cx="104" cy="183" rx="18" ry="7" fill="#ffffff" opacity="0.95"/>
    </g>

    <!-- ==================== HEAVY MUD LOAM OVERBURDEN ==================== -->
    <!-- Natural dark mudbank curves that cover, cup, and frame the deep glow -->
    <path d="M 18 178 
             C 42 172 68 180 92 176 
             C 114 172 136 179 160 175 
             C 184 171 210 182 238 186 
             L 238 238 L 18 238 Z" 
          fill="#1b1c26" opacity="0.9"/>

    <!-- Foreground mudbank shelf: thick, heavy, organic earth -->
    <path d="M 18 190 
             C 48 184 80 194 112 189 
             C 138 185 166 196 196 192 
             C 214 190 228 196 238 198 
             L 238 238 L 18 238 Z" 
          fill="#14151e"/>

    <path d="M 18 206 
             C 50 200 84 212 118 207 
             C 148 204 178 218 206 220 
             C 220 222 232 226 238 226 
             L 238 238 L 18 238 Z" 
          fill="#0c0d12"/>

    <!-- Wet mud glossy highlight curves catching the warm upward glow -->
    <path d="M 42 182 C 68 176 96 184 122 180 C 142 177 164 182 186 186" fill="none" stroke="#f1fa8c" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
    <path d="M 64 196 C 92 191 122 198 152 194" fill="none" stroke="#ffb86c" stroke-width="1.1" stroke-linecap="round" opacity="0.35"/>

    <!-- Luminous golden motes & embers drifting up into the midnight air -->
    <g opacity="0.85">
      <circle cx="94" cy="146" r="1.8" fill="#fff8db"/>
      <circle cx="136" cy="140" r="2.0" fill="#f1fa8c"/>
      <circle cx="116" cy="126" r="1.5" fill="#ffb86c"/>
      <circle cx="150" cy="152" r="1.6" fill="#fff8db"/>
      <circle cx="80" cy="154" r="1.4" fill="#ffb86c"/>
      <circle cx="108" cy="114" r="1.2" fill="#fff8db"/>
      <circle cx="128" cy="108" r="1.0" fill="#f1fa8c"/>
      <circle cx="160" cy="132" r="1.3" fill="#ffb86c"/>
    </g>

    <!-- Top Glass Sheen Arc -->
    <path d="M 32 40 C 70 24 186 24 224 40 C 190 74 66 74 32 40 Z" fill="#ffffff" opacity="0.05"/>
  </g>

  <!-- ==================== CONTAINER BORDER OVERLAYS (UNCLIPPED FOR CRISPNESS) ==================== -->
  <!-- Outer Dracula Bezel -->
  <rect x="18.5" y="18.5" width="219" height="219" rx="51.5" fill="none" stroke="url(#dracula-rim)" stroke-width="2.5" stroke-opacity="0.95"/>
  <!-- Inner Bezel Bevel Line -->
  <rect x="22" y="22" width="212" height="212" rx="48" fill="none" stroke="#191a21" stroke-width="2" stroke-opacity="0.75"/>
</svg>
